name: Run Unit Tests

on:
  push:
    branches:
      - '**'        # Scatta su QUALSIASI branch (main, implement_time, feature-x, ecc.)
  pull_request:
    branches:
      - '**'        # Scatta su qualsiasi Pull Request verso qualsiasi branch

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numba numpy pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run unit tests
      run: |
        python -m unittest discover -s . -p "test_*.py"